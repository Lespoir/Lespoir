name: Update merged PR chart
on:
  schedule:
    - cron: '23 11 * * *' # 06:23 Bogotá; GitHub may delay scheduled runs.
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'scripts/**'
      - 'tests/**'
      - 'assets/merged-prs-*.svg'
      - '.github/workflows/update-pr-chart.yml'
permissions:
  contents: read
concurrency:
  group: merged-pr-chart
  cancel-in-progress: false
jobs:
  update:
    if: github.event_name != 'push'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Check chart behavior
        run: python3 -m unittest discover -s tests -v
      - name: Generate charts from aggregate counts
        env:
          GH_TOKEN: ${{ secrets.PR_STATS_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo 'Add the PR_STATS_TOKEN Actions secret to enable private merged-PR counts. Existing charts are unchanged.'
            exit 1
          fi
          python3 scripts/update_chart.py
      - name: Save the refreshed chart
        run: |
          git add README.md assets/merged-prs-light.svg assets/merged-prs-dark.svg assets/merged-prs.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Update merged pull request activity'
          git push
  publish:
    needs: update
    if: ${{ always() && (needs.update.result == 'success' || needs.update.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main # Includes the refreshed snapshot committed by the update job.
      - name: Check and build the interactive chart
        run: |
          python3 -m unittest discover -s tests -v
          python3 scripts/build_page.py
      - name: Upload only the public chart page
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: _site
      - name: Publish the chart
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

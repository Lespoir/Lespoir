name: Update merged PR chart
on:
  schedule:
    - cron: '23 11 * * *' # 06:23 Bogotá; GitHub may delay scheduled runs.
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: merged-pr-chart
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Check chart behavior
        run: python3 -m unittest discover -s tests -v
      - name: Generate charts from aggregate counts
        env:
          GH_TOKEN: ${{ secrets.PR_STATS_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo 'Add the PR_STATS_TOKEN Actions secret to enable private merged-PR counts. Existing charts are unchanged.'
            exit 1
          fi
          python3 scripts/update_chart.py
      - name: Save the refreshed chart
        run: |
          git add README.md assets/*.svg assets/merged-prs.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Update merged pull request activity'
          git push
